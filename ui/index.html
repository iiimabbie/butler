<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Butler Session</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body><main><header><div><p class="eyebrow">BUTLER · Session／RQ 檢視與 Google 授權</p><h1>對話與請求</h1></div><button id="refresh">重新整理</button></header><nav role="tablist"><button role="tab" aria-selected="true" data-tab="sessions">Session</button><button role="tab" aria-selected="false" data-tab="request">Latest Request</button></nav><section id="google-auth" aria-labelledby="google-title"><h2 id="google-title">Google 授權</h2><p id="google-status">檢查連線狀態…</p><button id="google-start" type="button">開始授權</button><div id="google-complete" hidden><label for="google-url">貼上 Google 導回的完整網址</label><input id="google-url" type="url" autocomplete="off" spellcheck="false"><button id="google-submit" type="button">完成連線</button></div><p id="google-note">授權會保存 Google 憑證。請勿將授權網址分享或貼入對話。</p></section><p id="status" aria-live="polite">載入中…</p><section id="sessions" role="tabpanel"><div class="columns"><aside><h2>Sessions</h2><div id="session-list"></div><button id="more-sessions" hidden>載入更多</button></aside><article><h2 id="session-title">選擇一個 Session</h2><div class="subtabs"><button data-kind="messages" class="selected">對話</button><button data-kind="tools">工具呼叫</button></div><div id="records"></div><button id="more-records" hidden>載入更多</button></article></div></section><section id="request" role="tabpanel" hidden><div class="toolbar"><p id="request-meta">尚未有 CPA 請求快照。</p><button id="copy" disabled>複製原始 JSON</button><button id="download" disabled>下載原始 JSON</button></div><pre id="request-body"></pre></section></main></body></html>

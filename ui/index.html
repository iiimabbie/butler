<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Butler Google 授權</title>
  <link rel="stylesheet" href="style.css?v=20261113-frame-scheme">
  <script src="app.js?v=20261113-frame-scheme" defer></script>
</head>
<body>
<main>
  <header class="page-header"><div class="brand"><p class="eyebrow">BUTLER</p><h1>Google 授權</h1></div><button id="refresh" type="button">重新整理</button></header>
  <section id="google-auth"><h2>Google 連線設定</h2><p id="google-status">檢查連線狀態…</p><div id="google-accounts"></div><button id="google-start" type="button">新增帳號／重新授權</button><div id="google-complete" hidden><label for="google-url">貼上 Google 導回的完整網址</label><input id="google-url" type="url" autocomplete="off" spellcheck="false"><button id="google-submit" type="button">完成連線</button></div><p id="google-note">授權會保存 Google 憑證。請勿將授權網址分享或貼入對話。</p></section>
</main>
</body>
</html>

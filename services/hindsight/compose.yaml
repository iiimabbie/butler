services:
  hindsight:
    image: butler-hindsight:0.10.2-jev20k
    build:
      context: .
    container_name: butler-hindsight-evaluation
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HINDSIGHT_API_DATABASE_URL: 'pg0://hindsight:5432?listen_addresses=*&hba_file=/home/hindsight/.pg0/host-access.conf'
      HINDSIGHT_API_LOG_LEVEL: info
      HINDSIGHT_API_LOG_FORMAT: json
      HINDSIGHT_API_RERANKER_PROVIDER: typesafe
      HINDSIGHT_API_RERANKER_TYPESAFE_MODEL: jev-latest
      HINDSIGHT_API_RERANKER_MAX_CANDIDATES: "50"
    ports:
      - "127.0.0.1:18888:8888"
      - "127.0.0.1:15432:5432"
      - "127.0.0.1:19999:9999"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hindsight_eval_data:/home/hindsight/.pg0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

volumes:
  hindsight_eval_data:
    name: butler-hindsight-evaluation-data

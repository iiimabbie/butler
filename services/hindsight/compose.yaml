services:
  hindsight:
    image: butler-hindsight:1.0.0-central-defaults
    build:
      context: .
      dockerfile: Dockerfile.v1.0.0
    container_name: butler-hindsight-evaluation
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HINDSIGHT_API_LOG_LEVEL: info
      HINDSIGHT_API_LOG_FORMAT: json
      # Keeps the worker id across container recreation so startup recovery can reclaim its own in-flight tasks.
      HINDSIGHT_API_WORKER_ID: butler-hindsight
      # Multilingual keyword search; indexes managed by the AP on the external DB.
      HINDSIGHT_API_TEXT_SEARCH_EXTENSION: pgroonga
      # Shared reasoning default; stages inherit unless explicitly overridden.
      HINDSIGHT_API_LLM_REASONING_EFFORT: "high"
      # Single output-language setting for all Hindsight-generated artifacts.
      HINDSIGHT_API_LLM_OUTPUT_LANGUAGE: "Traditional Chinese (Taiwan)"
      HINDSIGHT_API_RERANKER_PROVIDER: typesafe
      HINDSIGHT_API_RERANKER_TYPESAFE_MODEL: jev-latest
      HINDSIGHT_API_RERANKER_MAX_CANDIDATES: "50"
      HINDSIGHT_API_RERANKER_MAX_CANDIDATES_LOW: "30"
      HINDSIGHT_API_RERANKER_MAX_CANDIDATES_MID: "50"
      HINDSIGHT_API_RERANKER_MAX_CANDIDATES_HIGH: "50"
      # Local API-default patch: Butler omits these parameters entirely.
      HINDSIGHT_API_REQUEST_RECALL_BUDGET: "mid"
      HINDSIGHT_API_REQUEST_RECALL_MAX_TOKENS: "1200"
      HINDSIGHT_API_REQUEST_REFLECT_BUDGET: "mid"
      HINDSIGHT_API_REQUEST_REFLECT_MAX_TOKENS: "1600"
      # Interactive reflect: faster agent steps and a per-call deadline above the 30 s upstream default.
      HINDSIGHT_API_REFLECT_LLM_REASONING_EFFORT: "medium"
      HINDSIGHT_API_REFLECT_LLM_TIMEOUT: "120"
      # Background mental-model refresh would inherit reflect's effort; keep the shared default.
      HINDSIGHT_API_MENTAL_MODEL_REFRESH_LLM_REASONING_EFFORT: "medium"
      # Total reflect deadline; Butler waits 30 s longer to receive this timeout response,
      # staying under Node fetch's 300 s response-headers timeout.
      HINDSIGHT_API_REFLECT_WALL_TIMEOUT: "270"
    ports:
      - "127.0.0.1:18888:8888"
      - "127.0.0.1:19999:9999"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

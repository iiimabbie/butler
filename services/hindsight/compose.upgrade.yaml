services:
  hindsight:
    image: butler-hindsight:1.0.0-central-defaults
    build:
      context: .
      dockerfile: Dockerfile.v1.0.0
    container_name: butler-hindsight-v1-upgrade-isolated
    restart: "no"
    env_file:
      - ../../backups/hindsight/upgrade-v1.0.0-20261015T023205Z/.env
    environment:
      HINDSIGHT_API_DATABASE_URL: 'pg0://hindsight:5432?listen_addresses=*&hba_file=/home/hindsight/.pg0/host-access.conf'
      HINDSIGHT_API_LOG_LEVEL: info
      HINDSIGHT_API_LOG_FORMAT: json
      HINDSIGHT_API_LLM_REASONING_EFFORT: "high"
      HINDSIGHT_API_LLM_OUTPUT_LANGUAGE: "Traditional Chinese (Taiwan)"
      HINDSIGHT_API_RERANKER_PROVIDER: typesafe
      HINDSIGHT_API_RERANKER_TYPESAFE_MODEL: jev-latest
      HINDSIGHT_API_RERANKER_MAX_CANDIDATES: "50"
      HINDSIGHT_API_RERANKER_MAX_CANDIDATES_LOW: "30"
      HINDSIGHT_API_RERANKER_MAX_CANDIDATES_MID: "50"
      HINDSIGHT_API_RERANKER_MAX_CANDIDATES_HIGH: "50"
      HINDSIGHT_API_REQUEST_RECALL_BUDGET: "mid"
      HINDSIGHT_API_REQUEST_RECALL_MAX_TOKENS: "1200"
      HINDSIGHT_API_REQUEST_REFLECT_BUDGET: "mid"
      HINDSIGHT_API_REQUEST_REFLECT_MAX_TOKENS: "1600"
      HINDSIGHT_API_WORKER_ENABLED: "false"
    ports:
      - "127.0.0.1:28889:8888"
      - "127.0.0.1:25433:5432"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hindsight_upgrade_data:/home/hindsight/.pg0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
volumes:
  hindsight_upgrade_data:
    external: true
    name: butler-hindsight-restore-verify-data

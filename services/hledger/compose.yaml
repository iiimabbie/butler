# Butler runs hledger with `docker exec butler-hledger hledger ...`; the ledger stays in .data/hledger.
services:
  hledger:
    build: .
    image: butler-hledger:1.52.4
    container_name: butler-hledger
    restart: unless-stopped
    user: "1000:1000"
    init: true
    network_mode: none
    volumes:
      - ../../.data/hledger:/hledger

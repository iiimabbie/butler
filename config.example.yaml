discord:
  token: YOUR_DISCORD_BOT_TOKEN
  ownerId: "YOUR_DISCORD_ACCOUNT_ID"
  # Optional error-only notifications; validated Discord webhook URL.
  # errorWebhookUrl: https://discord.com/api/webhooks/WEBHOOK_ID/WEBHOOK_TOKEN
  # Optional numeric user ID to mention on error notifications.
  # errorWebhookMentionUserId: "YOUR_DISCORD_ACCOUNT_ID"
  # Optional existing forum post (thread) ID for error notifications.
  # errorWebhookThreadId: "YOUR_DISCORD_THREAD_ID"
  # Optional destination for external notification intake; required when notifications is configured.
  # notificationChannelId: "YOUR_PRIVATE_DISCORD_CHANNEL_ID"
  # General channel membership and overrides live in .data/config/channels.yaml.

llm:
  baseUrl: https://your-cpa.example/v1
  apiKey: YOUR_CPA_API_KEY
  model: YOUR_CHAT_MODEL
  maxContextTokens: 150000
  requestTimeoutMs: 600000
  modelContextTokens:
    gpt-6.1-sol: 272000

web:
  # All providers default to disabled. Enabling requires an API key and explicit daily request limit.
  # Optional serial fallback. Unsupported hard filters skip a provider, never silently downgrade.
  pool:
    searchOrder: [tavily, anysearch, firecrawl]
    fetchOrder: [tavily, anysearch, firecrawl]
    searchTimeoutMs: 30000
    fetchTimeoutMs: 45000
    attemptTimeoutMs: 15000
    maxAttempts: 3
  tavily:
    enabled: true
    apiKey: YOUR_TAVILY_API_KEY
    baseUrl: https://api.tavily.com
    dailyRequestLimit: 100
  # Keep disabled until free-plan/account limits and small live samples have been checked.
  anysearch:
    enabled: false
    # apiKey: YOUR_ANYSEARCH_API_KEY
    baseUrl: https://api.anysearch.com/v1
    dailyRequestLimit: 20
  firecrawl:
    enabled: false
    # apiKey: YOUR_FIRECRAWL_API_KEY
    baseUrl: https://api.firecrawl.dev/v2
    dailyRequestLimit: 10

# Optional. Omit to disable the web UI.
ui:
  port: 3211
  publicOrigin: https://butler.example.com
  cookiePath: /

# Optional independent notification intake. Omit the entire section to disable.
# Values below are placeholders; use an interface reachable by your gateway.
# Configure the destination under discord, never in the incoming payload.
# notifications:
#   host: 127.0.0.1
#   port: 3212
#   bearerToken: REPLACE_WITH_A_RANDOM_PRIVATE_TOKEN


google:
  clientId: YOUR_GOOGLE_OAUTH_CLIENT_ID
  clientSecret: YOUR_GOOGLE_OAUTH_CLIENT_SECRET

# Optional speech transcription for incoming audio attachments.
transcription:
  provider: groq
  apiKey: YOUR_GROQ_API_KEY

# Optional shared long-term memory.
memory:
  baseUrl: http://127.0.0.1:18888
  bankId: Renee
  timeoutMs: 30000
  # recallBudget: 2.00
  # reflectBudget: 2.00
  # maxTokens: 8000

# Optional independent image generation endpoint. Only protocol: images is supported.
# Both image tools use this endpoint/model and the per-channel /img_model override.
image:
  baseUrl: https://your-cpa.example/v1
  apiKey: YOUR_IMAGE_API_KEY
  model: gpt-image-2.5
  protocol: images
  timeoutMs: 300000
  # Optional path (relative to the project root); when set, image_generate with self=true always includes this reference.
  identityReferencePath: workspace/renee/appearance-reference.png

# Optional background subagent (Codex CLI). Butler picks the model per task from the LLM endpoint's model list.
subagent:
  # toolsEnabled: true  # hot-reloadable; false hides and rejects parent management tools

# Optional default timezone for cron and reminder creation.
schedule:
  timezone: Asia/Taipei

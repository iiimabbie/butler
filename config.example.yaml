discord:
  token: YOUR_DISCORD_BOT_TOKEN
  ownerId: "YOUR_DISCORD_ACCOUNT_ID"
  # Optional error-only notifications; validated Discord webhook URL.
  # errorWebhookUrl: https://discord.com/api/webhooks/WEBHOOK_ID/WEBHOOK_TOKEN
  # Optional numeric user ID to mention on error notifications.
  # errorWebhookMentionUserId: "YOUR_DISCORD_ACCOUNT_ID"
  # Optional existing forum post (thread) ID for error notifications.
  # errorWebhookThreadId: "YOUR_DISCORD_THREAD_ID"
  # Root channels where Butler automatically replies; all received messages are still saved and retained. Slash commands are not restricted.
  # Discord tools and scheduled outputs use bot permissions, not this list.
  channelIds:
    - "YOUR_CHANNEL_ID"

llm:
  baseUrl: https://your-cpa.example/v1
  apiKey: YOUR_CPA_API_KEY
  model: YOUR_CHAT_MODEL
  maxContextTokens: 150000
  modelContextTokens:
    gpt-6.1-sol: 272000

web:
  provider: tavily
  baseUrl: https://api.tavily.com
  apiKey: YOUR_TAVILY_API_KEY

# Optional. Omit to disable the web UI.
ui:
  port: 3211
  publicOrigin: https://butler.example.com
  cookiePath: /

paths:
  database: /absolute/path/to/butler/.data/butler.sqlite
  attachments: /absolute/path/to/butler/.data/attachments

google:
  clientId: YOUR_GOOGLE_OAUTH_CLIENT_ID
  clientSecret: YOUR_GOOGLE_OAUTH_CLIENT_SECRET

# Optional shared long-term memory.
memory:
  baseUrl: http://127.0.0.1:18888
  bankId: butler-discord
  timeoutMs: 30000
  # recallBudget: 2.00
  # reflectBudget: 2.00
  # maxTokens: 8000

# Optional independent image generation endpoint. Only protocol: images is supported.
# Both image tools use this endpoint/model and the per-channel /img_model override.
image:
  baseUrl: https://your-cpa.example/v1
  apiKey: YOUR_IMAGE_API_KEY
  model: gpt-image-2.5
  protocol: images
  timeoutMs: 300000
  # Optional absolute path; when set, image_generate_self always includes this reference.
  identityReferencePath: /absolute/path/to/butler/workspace/renee/appearance-reference.png

# Optional synchronous subagent tool; uses llm.baseUrl/apiKey and this model.
subagent:
  model: YOUR_SUBAGENT_MODEL
  # maxTurns: 30
  # timeoutMs: 120000

# Optional default timezone for cron and reminder creation.
schedule:
  timezone: Asia/Taipei
